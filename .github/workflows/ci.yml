name: Java CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    name: Build, Test, and Deploy
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Log in to Azure
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        if: github.event_name != 'pull_request'
        run: az acr login --name acrciademo1c5f19

      - name: Build Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker build \
            -f docker/Dockerfile \
            -t acrciademo1c5f19.azurecr.io/azure-cicd-demo:${GITHUB_SHA} \
            .

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker push acrciademo1c5f19.azurecr.io/azure-cicd-demo:${GITHUB_SHA}

      - name: Set up kubectl
        if: github.event_name != 'pull_request'
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure Kubernetes access
        if: github.event_name != 'pull_request'
        env:
          KUBE_SERVER: ${{ vars.KUBE_SERVER }}
          KUBE_CA: ${{ vars.KUBE_CA }}
          KUBE_DEPLOYER_TOKEN: ${{ secrets.KUBE_DEPLOYER_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$KUBE_SERVER"
          test -n "$KUBE_CA"
          test -n "$KUBE_DEPLOYER_TOKEN"

          printf '%s' "$KUBE_CA" \
            | base64 --decode > "$RUNNER_TEMP/aks-ca.crt"

          kubectl config set-cluster aks \
            --server="$KUBE_SERVER" \
            --certificate-authority="$RUNNER_TEMP/aks-ca.crt"

          kubectl config set-credentials github-deployer \
            --token="$KUBE_DEPLOYER_TOKEN"

          kubectl config set-context github-deployer-context \
            --cluster=aks \
            --user=github-deployer \
            --namespace=cicd-demo

          kubectl config use-context github-deployer-context

      - name: Deploy to AKS
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          kubectl set image deployment/azure-cicd-demo \
            azure-cicd-demo=acrciademo1c5f19.azurecr.io/azure-cicd-demo:${GITHUB_SHA} \
            -n cicd-demo

          kubectl rollout status deployment/azure-cicd-demo \
            -n cicd-demo \
            --timeout=180s

      - name: Verify deployment
        if: github.event_name != 'pull_request'
        run: |
          kubectl get deployment azure-cicd-demo -n cicd-demo
          kubectl get pods -n cicd-demo
